name: Build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OPENWRT_VERSION: "25.12.6"
    steps:
      - uses: actions/checkout@v4

      - name: Download OpenWrt SDK
        run: |
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          sdk=$(curl -fsSL "$base/sha256sums" | grep -o 'openwrt-sdk-[^ ]*\.tar\.zst' | head -1)
          echo "SDK: $sdk"
          curl -fsSL "$base/$sdk" -o sdk.tar.zst
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Build package
        working-directory: sdk
        run: |
          ./scripts/feeds update base luci
          ./scripts/feeds install luci-base
          cp -r ../luci-theme-corenet package/
          make defconfig
          make package/luci-theme-corenet/compile V=s -j"$(nproc)"
          mkdir -p ../out
          find bin -name 'luci-theme-corenet*.apk' -exec cp {} ../out/ \;
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: luci-theme-corenet
          path: out/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            CoreNet LuCI theme for OpenWrt 25.12+ (apk, all architectures).

            Install on the router:
            ```
            cd /tmp && wget -O corenet.apk https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(ls out | head -1)
            apk add --allow-untrusted /tmp/corenet.apk
            ```
            Then pick **CoreNet** in System › System › Language and Style.
